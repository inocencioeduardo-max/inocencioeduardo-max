<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
<title id="title">Ino Builds AI.</title>
<desc id="desc">Terminal window. The command &quot;whoami&quot; prints &quot;Ino Builds AI.&quot;, then &quot;AI Automation Engineer · Telecom Platform Lead · Systems Builder&quot; and &quot;Netherlands · Dominican roots&quot;.</desc>
<style>
text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.chrome { fill: #8b98a5; font-size: 12px; }
.prompt { fill: #7ee2a8; font-size: 16px; }
.cmd { fill: #e6edf3; font-size: 16px; }
.title { fill: #e6edf3; font-size: 46px; font-weight: 700; }
.accent { fill: #5ccfe6; }
.sub { fill: #5ccfe6; font-size: 16px; opacity: 0.9; }
.foot { fill: #8b98a5; font-size: 13px; }
.type1 { animation: type 0.9s steps(20, end) 0.3s both; }
.type2 { animation: type 0.9s steps(14, end) 1.4s both; }
.fade1 { animation: fade 0.6s ease-out 2.5s both; }
.fade2 { animation: fade 0.6s ease-out 2.9s both; }
.cursor { fill: #7ee2a8; animation: show 0.01s linear 2.3s both, blink 0.9s steps(1, end) 2.3s 3; }
@keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes show { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="899" height="239" rx="12" fill="#0b1117" stroke="#1f2b37"/>
<path d="M1 36 H899" stroke="#1f2b37"/>
<circle cx="22" cy="18" r="5" fill="#5b6875"/>
<circle cx="40" cy="18" r="5" fill="#5b6875" opacity="0.7"/>
<circle cx="58" cy="18" r="5" fill="#5b6875" opacity="0.45"/>
<text x="450" y="22.5" text-anchor="middle" class="chrome">inocencioeduardo-max — profile</text>
<text x="40" y="80" class="type1"><tspan class="prompt">ino@builds:~$</tspan><tspan class="cmd"> whoami</tspan></text>
<text x="40" y="146" class="title type2" textLength="386" lengthAdjust="spacingAndGlyphs">Ino Builds <tspan class="accent">AI.</tspan></text>
<rect x="436" y="110" width="22" height="42" rx="2" class="cursor"/>
<text x="40" y="188" class="sub fade1">AI Automation Engineer · Telecom Platform Lead · Systems Builder</text>
<text x="40" y="216" class="foot fade2"># Netherlands · Dominican roots</text>
</svg>
