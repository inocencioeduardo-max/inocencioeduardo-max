<svg xmlns="http://www.w3.org/2000/svg" width="490" height="420" viewBox="0 0 490 420" role="img" aria-labelledby="title desc">
<title id="title">Ino Builds AI.</title>
<desc id="desc">Terminal info card. Role: AI Automation Engineer, Telecom Platform Lead, Systems Builder. Focus: AI tools, automation systems and, workflows that connect software, with real devices. Domains: Telecom &amp; cloud platforms, Wi-Fi · DOCSIS · IPv6, Device interoperability. Building: AI-EOS / ChatMap   [in development], DiamondScout       [in development]. Testing: Telecom test automation  [ongoing]. Base: Netherlands.</desc>
<style>
text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.title { fill: #e6edf3; font-size: 22px; font-weight: 700; }
.accent { fill: #56d364; }
.host { fill: #3fb950; font-size: 12.5px; }
.rule { fill: #484f58; font-size: 12.5px; }
.k { fill: #3fb950; font-size: 12.5px; font-weight: 700; }
.v { fill: #e6edf3; font-size: 12.5px; white-space: pre; }
.tag { fill: #8b949e; }
.cursor { fill: #56d364; animation: show 0.01s linear 1.1s both, blink 0.9s steps(1, end) 1.1s 2; }
.type { animation: type 0.8s steps(14, end) 0.3s both; }
.r { animation: fade 0.4s ease-out both; }
@keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes fade { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
@keyframes show { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
